function tiles(){const v=($('q')?.value||'').trim().toLowerCase(),l=P.filter(p=>(!cat||p.category===cat)&&(!v||p.name.toLowerCase().includes(v)||(p.barcode||'')===v));
 $('tiles').innerHTML=l.map(p=>`<div class="tile ${p.stock<=0?'x':''}" onclick="add(${p.id})"><b>${esc(p.name)}</b><div class="p">${mny(p.price)}/${p.unit}</div><span class="tag ${p.stock<=0?'e':p.stock<=p.min_stock?'w':''}">${q3(p.stock)} left</span></div>`).join('')||'<div class="empty">No products</div>'}
function setCat(c){cat=c;go('bill')}
function qEnter(){const v=$('q').value.trim().toLowerCase();if(!v)return;const p=P.find(p=>p.barcode===$('q').value.trim())||P.find(p=>p.name.toLowerCase().includes(v));p?(add(p.id),$('q').value='',tiles()):toast('Product not found',1)}
function add(id){const p=P.find(p=>p.id===id),c=cart.find(c=>c.id===id);if(p.stock<=0)return toast(p.name+' is out of stock',1);key=null;if(c){if(c.q+1>p.stock)return toast('Only '+q3(p.stock)+' '+p.unit+' in stock',1);c.q=q3(c.q+1)}else cart.push({id,q:Math.min(1,p.stock)});drawCart()}
function setQ(id,v){const p=P.find(p=>p.id===id),c=cart.find(c=>c.id===id);let q=parseFloat(v);if(!(q>0))q=1;if(q>p.stock){q=p.stock;toast('Only '+q3(p.stock)+' '+p.unit+' in stock',1)}key=null;c.q=q3(q);drawCart()}
const bump=(id,d)=>setQ(id,cart.find(c=>c.id===id).q+d),rm=id=>{key=null;cart=cart.filter(c=>c.id!==id);drawCart()};
function drawCart(){$('cart').innerHTML=cart.length?`<table>${cart.map(c=>{const p=P.find(p=>p.id===c.id);return`<tr><td>${esc(p.name)}<br><small>${mny(p.price)}/${p.unit}</small></td><td><div class="qty"><button class="o s" onclick="bump(${c.id},-1)">−</button><input type="number" min="0" step="any" value="${c.q}" onchange="setQ(${c.id},this.value)"><button class="o s" onclick="bump(${c.id},1)">+</button></div></td><td>${mny(p.price*c.q)}</td><td><button class="d s" onclick="rm(${c.id})">✕</button></td></tr>`}).join('')}</table>`:'<div class="empty">Cart is empty</div>';calc()}
function calc(){const sub=sum(cart,c=>P.find(p=>p.id===c.id).price*c.q),dp=Math.min(100,Math.max(0,+$('dc').value||0)),d=Math.round(sub*dp)/100,g=+$('gs').value,tx=Math.round((sub-d)*g)/100;
 $('tot').innerHTML=`<div><span>${t('Subtotal')}</span><span>${mny(sub)}</span></div><div><span>${t('Discount')} (${dp}%)</span><span>− ${mny(d)}</span></div><div><span>GST (${g}%)</span><span>${mny(tx)}</span></div><div class="gt"><span>${t('Total')}</span><span>${mny(sub-d+tx)}</span></div>`}
async function gen(){if(!cart.length)return toast('Add at least one product',1);const m=$('cm').value.trim();if(m&&!/^[6-9]\d{9}$/.test(m))return toast('Enter a valid 10-digit mobile number',1);const dp=+$('dc').value;if(!(dp>=0&&dp<=100))return toast('Discount must be 0–100',1);
 key=key||(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));$('gb').disabled=true;
 await run(async()=>{const b=await api('POST','/bills',{key,items:cart.map(c=>({id:c.id,qty:c.q})),customer:{name:$('cn').value,mobile:m},disc_pct:dp,gst_pct:+$('gs').value,pay:$('pm').value});cart=[];key=null;showBill(b);go('bill')});$('gb').disabled=false}

 d.splitTextToSize(ST.footer||'',w-8).forEach(x=>{L(x,c,{align:'center'});y+=3.5});saveFile(b.no+'.pdf',d)}catch(e){toast('Could not create PDF',1)}}

 await api(id?'PUT':'POST','/products'+(id?'/'+id:''),b);closeM();toast('Product saved');go(view)})}
async function delProd(id){if(confirm('Delete this product? Old bills are kept.'))await run(async()=>{await api('DELETE','/products/'+id);toast('Deleted');go(view)})}
function stockForm(id){const p=_pl.find(p=>p.id===id);openM(`<h3>${esc(p.name)} <small>(now ${q3(p.stock)} ${p.unit})</small></h3><label>Quantity (use − to reduce)</label><input id="k_q" type="number" step="any"><label>Reason</label><select id="k_r"><option>Purchase</option><option>Adjustment</option><option>Damage/Expired</option><option>Return</option></select><label>Note</label><input id="k_n" maxlength="80"><div style="display:flex;gap:8px;margin-top:16px"><button onclick="saveStock(${id})">${t('Save')}</button><button class="o" onclick="closeM()">${t('Cancel')}</button></div>`)}
async function saveStock(id){await run(async()=>{await api('POST','/products/'+id+'/stock',{qty:$('k_q').value,reason:$('k_r').value,note:$('k_n').value});closeM();toast('Stock updated');go('inv')})}
/* customers + bills */
function ct(){const v=($('cs').value||'').toLowerCase(),l=_cl.filter(c=>c.name.toLowerCase().includes(v)||c.mobile.includes(v));
 $('ct').innerHTML=l.length?`<table><tr><th>${t('Name')}</th><th>${t('Mobile')}</th><th>Bills</th><th>Spent</th><th></th></tr>${l.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.mobile}</td><td>${c.bills}</td><td>${mny(c.spent)}</td><td><button class="o s" onclick="hist(${c.id})">History</button> <button class="o s" onclick="custForm(${c.id})">${t('Edit')}</button></td></tr>`).join('')}</table>`:'<div class="empty">No customers yet. They are added automatically when a mobile number is entered while billing.</div>'}
function custForm(id){const c=_cl.find(c=>c.id===id)||{name:'',mobile:''};openM(`<h3>${id?t('Edit'):'Add'} customer</h3><label>${t('Name')} *</label><input id="u_n" value="${esc(c.name)}" maxlength="60"><label>${t('Mobile')} *</label><input id="u_m" value="${c.mobile}" inputmode="numeric" maxlength="10"><div style="display:flex;gap:8px;margin-top:16px"><button onclick="saveCust(${id||0})">${t('Save')}</button><button class="o" onclick="closeM()">${t('Cancel')}</button></div>`)}
async function saveCust(id){await run(async()=>{await api(id?'PUT':'POST','/customers'+(id?'/'+id:''),{name:$('u_n').value,mobile:$('u_m').value});closeM();toast('Customer saved');go('cust')})}
async function hist(id){await run(async()=>{const c=_cl.find(c=>c.id===id),l=await api('GET','/customers/'+id+'/bills');openM(`<h3>${esc(c.name)} · ${c.mobile}</h3>${l.length?`<div class="tw"><table><tr><th>Bill</th><th>Date</th><th>Total</th><th></th></tr>${l.map(b=>`<tr><td>${b.no}</td><td>${fdt(b.ts)}</td><td>${mny(b.total)}</td><td><button class="o s" onclick="showBill('${b.no}')">View</button></td></tr>`).join('')}</table></div>`:'<div class="empty">No purchases yet</div>'}<button class="o" style="margin-top:12px" onclick="closeM()">${t('Close')}</button>`)})}
async function bt(){await run(async()=>{const l=await api('GET','/bills?q='+encodeURIComponent($('bq').value.trim())+'&date='+$('bd').value);$('bt').innerHTML=l.length?`<table><tr><th>Bill</th><th>Date</th><th>${t('Name')}</th><th>Pay</th><th>${t('Total')}</th><th></th></tr>${l.map(b=>`<tr><td>${b.no}</td><td>${fdt(b.ts)}</td><td>${esc(b.cust_name)}</td><td>${b.pay}</td><td>${mny(b.total)}</td><td><button class="o s" onclick="showBill('${b.no}')">View / Reprint</button></td></tr>`).join('')}</table>`:'<div class="empty">No bills found</div>'})}
/* settings */
async function saveSet(){await run(async()=>{const g=k=>$('s_'+k).value;ST=await api('PUT','/settings',{shop_name:g('shop_name'),address:g('address'),mobile:g('mobile'),gstin:g('gstin'),gst_rates:g('gst_rates'),gst_default:g('gst_default'),prefix:g('prefix'),paper:g('paper'),footer:g('footer'),lang:g('lang'),logo:ST.logo||''});lang=ST.lang;toast('Settings saved');go('set')})}
async function chPw(){await run(async()=>{await api('POST','/password',{current:$('pw0').value,new:$('pw1').value});$('pw0').value=$('pw1').value='';toast('Password updated')})}
async function backup(){await saveFile('smartmart-backup-'+istDay()+'.json',new Blob([dbExport()],{type:'application/json'}))}
function restore(i){const f=i.files[0];if(!f)return;if(!confirm('Replace ALL current data with this backup?'))return(i.value='');const r=new FileReader();r.onload=()=>run(async()=>{dbImport(r.result);toast('Backup restored');await boot()});r.readAsText(f)}
boot();
</script></body></html>
